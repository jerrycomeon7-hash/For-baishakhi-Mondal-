<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Baishakhi ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffe6f0;
      transition: background 0.8s ease;
    }

    #proposal-box {
      text-align: center;
      padding: 30px 20px;
      z-index: 10;
    }

    h1 {
      color: #d60059;
      font-size: 24px;
      margin-bottom: 40px;
      line-height: 1.4;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    button {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    #yes-btn {
      background: #ff3377;
      color: white;
    }

    #no-btn {
      background: #808080;
      color: white;
      position: relative;
      transition: left 0.15s ease, top 0.15s ease;
    }

    #music-btn {
      display: none;
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 20;
      padding: 8px 14px;
      font-size: 16px;
      background: rgba(255, 26, 83, 0.35);
      color: white;
      border: 1px solid rgba(255, 77, 136, 0.7);
      border-radius: 20px;
    }

    canvas {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #bg-canvas {
      z-index: 1;
    }

    #photo-layer {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .popup-photo {
      position: absolute;
      width: 96px;
      height: 96px;
      object-fit: cover;
      border-radius: 14px;
      border: 2px solid rgba(255, 102, 153, 0.85);
      box-shadow: 0 0 18px rgba(255, 26, 83, 0.65);
      opacity: 0;
      transform: scale(0.5);
      animation: popAndFade 4s ease-in-out forwards;
    }

    @keyframes popAndFade {
      0% {
        opacity: 0;
        transform: scale(0.5) rotate(-5deg);
      }
      18% {
        opacity: 0.92;
        transform: scale(1) rotate(3deg);
      }
      82% {
        opacity: 0.92;
        transform: scale(1.03) rotate(-2deg);
      }
      100% {
        opacity: 0;
        transform: scale(0.7) rotate(4deg);
      }
    }

    #heart-canvas {
      z-index: 3;
    }

    #countdown-box {
      display: none;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 360px;
      text-align: center;
      z-index: 5;
      background: rgba(255, 26, 83, 0.18);
      border: 1px solid rgba(255, 77, 136, 0.55);
      border-radius: 16px;
      padding: 12px 16px;
      backdrop-filter: blur(4px);
    }

    #countdown-title {
      color: #ffd6e6;
      font-size: 14px;
      margin-bottom: 6px;
    }

    #timer {
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 0 0 8px #ff1a53;
    }
  </style>
</head>
<body>

  <div id="proposal-box">
    <h1>Baishakhi, will you be mine forever? 💍❤️</h1>
    <div class="btn-group">
      <button id="yes-btn">YES 😍</button>
      <button id="no-btn">NO 😒</button>
    </div>
  </div>

  <!-- Background Song -->
  <audio id="bg-music" src="song.mp3" loop preload="auto"></audio>
  <button id="music-btn">🔊</button>

  <canvas id="bg-canvas"></canvas>
  <div id="photo-layer"></div>
  <canvas id="heart-canvas"></canvas>

  <div id="countdown-box">
    <div id="countdown-title">Counting down to 23rd December ❤️</div>
    <div id="timer">Loading...</div>
  </div>

  <script>
    const gfName = "Baishakhi Mondal";
    const targetDate = new Date("2026-12-23T00:00:00+05:30").getTime();
    const photos = ["1.jpg.jpg", "2.jpg.jpg", "3.jpg.jpg", "4.jpg.JPG"];

    // Background-e chobi preload
    const preloadedImages = [];
    photos.forEach(src => {
      const img = new Image();
      img.src = src;
      preloadedImages.push(img);
    });

    const noBtn = document.getElementById("no-btn");
    const yesBtn = document.getElementById("yes-btn");
    const proposalBox = document.getElementById("proposal-box");
    const bgCanvas = document.getElementById("bg-canvas");
    const bgCtx = bgCanvas.getContext("2d");
    const photoLayer = document.getElementById("photo-layer");
    const heartCanvas = document.getElementById("heart-canvas");
    const heartCtx = heartCanvas.getContext("2d");
    const countdownBox = document.getElementById("countdown-box");
    const timerEl = document.getElementById("timer");
    const bgMusic = document.getElementById("bg-music");
    const musicBtn = document.getElementById("music-btn");

    function moveNoButton(e) {
      e.preventDefault();
      noBtn.style.position = "fixed";
      const maxX = window.innerWidth - noBtn.offsetWidth - 20;
      const maxY = window.innerHeight - noBtn.offsetHeight - 20;
      const randomX = Math.max(20, Math.floor(Math.random() * maxX));
      const randomY = Math.max(20, Math.floor(Math.random() * maxY));
      noBtn.style.left = randomX + "px";
      noBtn.style.top = randomY + "px";
    }

    noBtn.addEventListener("touchstart", moveNoButton);
    noBtn.addEventListener("mouseover", moveNoButton);
    noBtn.addEventListener("click", moveNoButton);

    yesBtn.addEventListener("click", () => {
      proposalBox.style.display = "none";
      document.body.style.background = "#000000";
      bgCanvas.style.display = "block";
      photoLayer.style.display = "block";
      heartCanvas.style.display = "block";
      musicBtn.style.display = "block";

      bgMusic.play().catch(err => console.log("Audio play error:", err));

      startFallingHearts();
      startMainHeart();
      startPopupPhotos();
    });

    musicBtn.addEventListener("click", () => {
      if (bgMusic.paused) {
        bgMusic.play();
        musicBtn.innerText = "🔊";
      } else {
        bgMusic.pause();
        musicBtn.innerText = "🔇";
      }
    });

    function startPopupPhotos() {
      let index = 0;

      // 4-te ekdom alada kona, jeno kono chobi overlap na hoy
      const spots = [
        { top: "18px", left: "14px" },
        { top: "68px", right: "14px" },
        { bottom: "130px", left: "14px" },
        { bottom: "130px", right: "14px" }
      ];

      function spawnPhoto() {
        if (photos.length === 0) return;

        const img = document.createElement("img");
        img.src = photos[index % photos.length];
        img.className = "popup-photo";

        const spot = spots[index % spots.length];
        if (spot.top) img.style.top = spot.top;
        if (spot.bottom) img.style.bottom = spot.bottom;
        if (spot.left) img.style.left = spot.left;
        if (spot.right) img.style.right = spot.right;

        photoLayer.appendChild(img);
        index++;

        setTimeout(() => {
          img.remove();
        }, 4100);
      }

      spawnPhoto();
      setInterval(spawnPhoto, 1200);
    }

    function startCountdown() {
      countdownBox.style.display = "block";

      function updateTimer() {
        const now = new Date().getTime();
        const diff = targetDate - now;

        if (diff <= 0) {
          timerEl.innerText = "Finally Meeting Today! 🥰❤️";
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        timerEl.innerText = `${days}d : ${hours}h : ${minutes}m : ${seconds}s`;
      }

      updateTimer();
      setInterval(updateTimer, 1000);
    }

    function startFallingHearts() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;

      const hearts = [];
      const heartSymbols = ["❤️", "💖", "💕", "💗"];
      const totalHearts = 35;

      for (let i = 0; i < totalHearts; i++) {
        hearts.push({
          x: Math.random() * bgCanvas.width,
          y: Math.random() * bgCanvas.height - bgCanvas.height,
          size: Math.random() * 16 + 12,
          speed: Math.random() * 2 + 1,
          sway: Math.random() * 1.5 - 0.75,
          symbol: heartSymbols[Math.floor(Math.random() * heartSymbols.length)],
          opacity: Math.random() * 0.6 + 0.4
        });
      }

      function animateFall() {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

        hearts.forEach(h => {
          bgCtx.globalAlpha = h.opacity;
          bgCtx.font = `${h.size}px Arial`;
          bgCtx.fillText(h.symbol, h.x, h.y);

          h.y += h.speed;
          h.x += h.sway;

          if (h.y > bgCanvas.height + 30) {
            h.y = -20;
            h.x = Math.random() * bgCanvas.width;
          }
        });

        requestAnimationFrame(animateFall);
      }

      animateFall();
    }

    function startMainHeart() {
      heartCanvas.width = window.innerWidth;
      heartCanvas.height = window.innerHeight;

      const cx = heartCanvas.width / 2;
      const cy = heartCanvas.height / 2 - 20;
      const scale = Math.min(heartCanvas.width, heartCanvas.height) / 36;
      const steps = 140;
      let i = 0;

      heartCtx.strokeStyle = "#ff1a53";
      heartCtx.lineWidth = 2;
      heartCtx.shadowBlur = 12;
      heartCtx.shadowColor = "#ff1a53";

      function drawStep() {
        if (i <= steps) {
          const t = i * ((2 * Math.PI) / steps);
          const x = cx + 16 * Math.pow(Math.sin(t), 3) * scale;
          const y = cy - (
            13 * Math.cos(t) -
            5 * Math.cos(2 * t) -
            2 * Math.cos(3 * t) -
            Math.cos(4 * t)
          ) * scale;

          heartCtx.beginPath();
          heartCtx.moveTo(cx, cy);
          heartCtx.lineTo(x, y);
          heartCtx.stroke();

          i++;
          requestAnimationFrame(drawStep);
        } else {
          heartCtx.shadowBlur = 8;
          heartCtx.shadowColor = "#ff4d88";
          heartCtx.textAlign = "center";

          heartCtx.fillStyle = "#ffffff";
          heartCtx.font = "bold 20px Arial";
          heartCtx.fillText(`${gfName} ❤️`, cx, cy - 20);

          heartCtx.fillStyle = "#ffd6e6";
          heartCtx.font = "15px Arial";
          heartCtx.fillText("We will meet very soon,", cx, cy + 8);

          heartCtx.fillStyle = "#ffffff";
          heartCtx.font = "bold 18px Arial";
          heartCtx.fillText("I Love You, Beboo! 🥰", cx, cy + 34);

          startCountdown();
        }
      }

      drawStep();
    }
  </script>

</body>
</html>
